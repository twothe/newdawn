// NeoForge is confined to this integration module; terrain-core uses the JDK only.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
version = mod_version
group = 'two.newdawn'
base { archivesName = 'newdawn' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
// Integration fixtures compile against the game but never enter the production source set.
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    integrationTestImplementation.extendsFrom implementation
    integrationTestRuntimeOnly.extendsFrom runtimeOnly
}
neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.integrationTest
    mods {
        newdawn { sourceSet sourceSets.main }
        newdawnIntegration {
            sourceSet sourceSets.main
            sourceSet sourceSets.integrationTest
        }
    }
    runs {
        client { client(); loadedMods = [mods.newdawn] }
        server { server(); programArgument '--nogui'; loadedMods = [mods.newdawn] }
        smokeServer {
            server()
            sourceSet = sourceSets.integrationTest
            loadedMods = [mods.newdawnIntegration]
            gameDirectory = file(project.findProperty('smokeDirectory') ?: 'build/smoke-server')
            programArgument '--nogui'
            systemProperty 'newdawn.smokeTest', 'true'
            if (project.hasProperty('decorationBaseline')) systemProperty 'newdawn.decorationBaseline', 'true'
            if (project.hasProperty('climateSurvey')) {
                systemProperty 'newdawn.climateSurvey', 'true'
                systemProperty 'newdawn.climateSurveyOutput', layout.buildDirectory.file('biome-climate-survey.json').get().asFile.absolutePath
                if (project.hasProperty('climateAccess')) systemProperty 'newdawn.climateAccess', 'true'
            }
            if (project.hasProperty('profileGeneration')) {
                jvmArgument "-XX:StartFlightRecording=filename=${layout.buildDirectory.get()}/server-generation.jfr,settings=profile,dumponexit=true"
            }
            if (project.hasProperty('benchmarkGeneration')) systemProperty 'newdawn.benchmarkGeneration', 'true'
        }
    }
}
dependencies {
    implementation project(':terrain-core')
    // Plain Java libraries must be explicit on the development launcher's classpath.
    additionalRuntimeClasspath project(':terrain-core')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.named('jar') {
    from project(':terrain-core').sourceSets.main.output
}
tasks.named('check') { dependsOn ':terrain-core:check' }

// Verify the actual distribution: the core is embedded and development fixtures are absent.
tasks.register('verifyJar') {
    dependsOn tasks.named('jar')
    def archive = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def releaseVersion = project.version.toString()
    inputs.file archive
    def developmentSources = [sourceSets.integrationTest, project(':terrain-core').sourceSets.test,
                              project(':terrain-core').sourceSets.benchmark]
    inputs.files developmentSources.collect { it.allJava }
    doLast {
        def developmentClasses = new HashSet<String>()
        developmentSources.each { sources ->
            sources.allJava.srcDirs.each { root ->
                fileTree(root).matching { include '**/*.java' }.files.each { source ->
                    developmentClasses.add(root.toPath().relativize(source.toPath()).toString()
                            .replace('\\', '/').replaceAll(/\.java$/, ''))
                }
            }
        }
        new java.util.zip.ZipFile(archive.get().asFile).withCloseable { zip ->
            [
                'two/newdawn/NewDawn.class',
                'two/newdawn/terrain/TerrainSampler.class',
                'two/newdawn/terrain/SimplexNoise.class',
                'two/newdawn/integration/NewDawnChunkGenerator.class',
                'META-INF/neoforge.mods.toml',
                'data/newdawn/worldgen/world_preset/new_dawn.json',
                'data/newdawn/worldgen/world_preset/vanilla.json',
                'data/minecraft/worldgen/world_preset/normal.json',
                'data/minecraft/tags/worldgen/world_preset/normal.json'
            ].each { name ->
                if (zip.getEntry(name) == null) throw new GradleException("Missing release entry: $name")
            }
            zip.entries().each { entry ->
                def owner = entry.name.replaceAll(/\.class$/, '').split(/\$/)[0]
                if (developmentClasses.contains(owner) || entry.name.contains('/Smoke')
                        || entry.name.contains('legacy-terrain') || entry.name.endsWith('.java')) {
                    throw new GradleException("Development entry leaked into release: ${entry.name}")
                }
            }
            def metadata = zip.getInputStream(zip.getEntry('META-INF/neoforge.mods.toml')).getText('UTF-8')
            if (!metadata.contains('version="' + releaseVersion + '"')) throw new GradleException('Unexpanded release version')
        }
        logger.lifecycle('PASS: release jar contains terrain core, world preset and expanded metadata; no development fixtures')
    }
}
tasks.named('check') { dependsOn 'verifyJar' }

apply from: 'gradle/test-install.gradle'
